<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Level & Progress Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        },
                        neon: {
                            cyan: '#06b6d4',
                            purple: '#8b5cf6',
                            emerald: '#10b981',
                            amber: '#f59e0b',
                            rose: '#f43f5e'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-neon-purple selection:text-white">

    <!-- Header -->
    <header class="border-b border-dark-700 bg-dark-800/50 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-neon-purple to-neon-cyan p-2.5 rounded-xl shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-gamepad text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">QuestLog</h1>
                    <p class="text-xs text-slate-400">Game Level & Progress Tracker</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button type="button" id="open-modal-btn" class="bg-gradient-to-r from-neon-purple to-indigo-600 hover:from-neon-purple/90 hover:to-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm shadow-md shadow-indigo-500/20 transition-all flex items-center space-x-2 active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add New Game</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-dark-800/80 border border-dark-700 rounded-2xl p-4 flex items-center space-x-4 shadow-sm">
                <div class="p-3 bg-cyan-500/10 text-neon-cyan rounded-xl">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Games</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-slate-100">0</h3>
                </div>
            </div>
            <div class="bg-dark-800/80 border border-dark-700 rounded-2xl p-4 flex items-center space-x-4 shadow-sm">
                <div class="p-3 bg-emerald-500/10 text-neon-emerald rounded-xl">
                    <i class="fa-solid fa-play text-xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Playing</p>
                    <h3 id="stat-playing" class="text-2xl font-bold text-slate-100">0</h3>
                </div>
            </div>
            <div class="bg-dark-800/80 border border-dark-700 rounded-2xl p-4 flex items-center space-x-4 shadow-sm">
                <div class="p-3 bg-purple-500/10 text-neon-purple rounded-xl">
                    <i class="fa-solid fa-trophy text-xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Completed</p>
                    <h3 id="stat-completed" class="text-2xl font-bold text-slate-100">0</h3>
                </div>
            </div>
            <div class="bg-dark-800/80 border border-dark-700 rounded-2xl p-4 flex items-center space-x-4 shadow-sm">
                <div class="p-3 bg-amber-500/10 text-neon-amber rounded-xl">
                    <i class="fa-solid fa-clock text-xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Backlog</p>
                    <h3 id="stat-backlog" class="text-2xl font-bold text-slate-100">0</h3>
                </div>
            </div>
        </div>

        <!-- Search and Filters Bar -->
        <div class="bg-dark-800/80 border border-dark-700 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Search game titles or platforms..." 
                    class="w-full bg-dark-900 border border-dark-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan transition-colors">
            </div>
            <div id="filter-buttons-container" class="flex items-center space-x-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <button type="button" data-filter="All" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-neon-purple text-white shadow-sm transition-all whitespace-nowrap cursor-pointer">All Status</button>
                <button type="button" data-filter="Playing" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-slate-400 hover:text-white border border-dark-700 transition-all whitespace-nowrap cursor-pointer">Playing</button>
                <button type="button" data-filter="Backlog" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-slate-400 hover:text-white border border-dark-700 transition-all whitespace-nowrap cursor-pointer">Backlog</button>
                <button type="button" data-filter="Completed" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-slate-400 hover:text-white border border-dark-700 transition-all whitespace-nowrap cursor-pointer">Completed</button>
                <button type="button" data-filter="On Hold" class="filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-slate-400 hover:text-white border border-dark-700 transition-all whitespace-nowrap cursor-pointer">On Hold</button>
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-dark-800/80 border border-dark-700 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-dark-700 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-dark-900/50">
                            <th class="py-4 px-6">Game Title</th>
                            <th class="py-4 px-6">Platform / Series</th>
                            <th class="py-4 px-6">Current Level / Stage</th>
                            <th class="py-4 px-6">Status</th>
                            <th class="py-4 px-6">Notes</th>
                            <th class="py-4 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="games-table-body" class="divide-y divide-dark-700/60 text-sm">
                        <!-- Dynamic rows injected via JS -->
                    </tbody>
                </table>
            </div>
            <!-- Empty state -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 px-4 text-center">
                <div class="w-16 h-16 bg-dark-700/50 rounded-full flex items-center justify-center text-slate-500 mb-4 text-2xl">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <h3 class="text-base font-medium text-slate-300">No games found</h3>
                <p class="text-sm text-slate-500 mt-1">Try adding your first game quest or clearing search filters.</p>
                <button type="button" id="empty-add-btn" class="mt-4 bg-neon-purple hover:bg-neon-purple/90 text-white text-xs font-medium px-4 py-2 rounded-xl transition-all cursor-pointer">
                    Add Game Now
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="game-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transform transition-all">
            <div class="flex items-center justify-between px-6 py-4 border-b border-dark-700 bg-dark-900/40">
                <h3 id="modal-title" class="font-bold text-base text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-gamepad text-neon-purple"></i>
                    <span>Add New Game</span>
                </h3>
                <button type="button" id="close-modal-btn" class="text-slate-400 hover:text-slate-200 transition-colors p-1 cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="game-form" class="p-6 space-y-4">
                <input type="hidden" id="game-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Game Title *</label>
                    <input type="text" id="form-title" required placeholder="e.g., Elden Ring, Hollow Knight" 
                        class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan transition-colors">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Platform / Series</label>
                        <input type="text" id="form-platform" placeholder="e.g., PC, PS5, Switch" 
                            class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Current Level / Stage</label>
                        <input type="text" id="form-level" placeholder="e.g., Level 45, Act 3" 
                            class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Status</label>
                    <select id="form-status" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-neon-cyan transition-colors">
                        <option value="Playing">Playing</option>
                        <option value="Backlog">Backlog</option>
                        <option value="Completed">Completed</option>
                        <option value="On Hold">On Hold</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Notes / Objectives</label>
                    <textarea id="form-notes" rows="3" placeholder="Add custom notes, builds, or next objectives..." 
                        class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan transition-colors resize-none"></textarea>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 rounded-xl text-xs font-medium bg-dark-700 hover:bg-dark-600 text-slate-300 transition-colors cursor-pointer">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-neon-purple to-indigo-600 hover:from-neon-purple/90 text-white shadow-md shadow-indigo-500/20 transition-all cursor-pointer">
                        Save Game
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-dark-800 border border-dark-700 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 pointer-events-none">
        <div class="text-neon-emerald">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <span id="toast-message" class="text-xs font-medium">Action completed successfully</span>
    </div>

    <!-- JavaScript Implementation -->
    <script>
        // Application State
        let games = [];
        let currentFilter = 'All';

        // Initialize App on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', () => {
            initTracker();
            setupEventListeners();
        });

        // Load data from localStorage or seed initial items
        function initTracker() {
            const savedGames = localStorage.getItem('questlog_games_v2');
            if (savedGames) {
                try {
                    games = JSON.parse(savedGames);
                } catch (e) {
                    games = [];
                }
            } else {
                games = [
                    { id: '1', title: 'Elden Ring', platform: 'PC / Steam', level: 'Leyndell (Lv. 92)', status: 'Playing', notes: 'Preparing for boss fight.' },
                    { id: '2', title: 'Baldur\'s Gate 3', platform: 'PC', level: 'Act 2', status: 'Playing', notes: 'Romancing Shadowheart.' },
                    { id: '3', title: 'Hollow Knight', platform: 'Switch', level: 'City of Tears', status: 'Backlog', notes: 'Need to return for exploration.' }
                ];
                saveToLocalStorage();
            }
            renderGames();
        }

        // Save state to localStorage and update stats
        function saveToLocalStorage() {
            localStorage.setItem('questlog_games_v2', JSON.stringify(games));
            updateStats();
        }

        // Update statistics counters
        function updateStats() {
            document.getElementById('stat-total').textContent = games.length;
            document.getElementById('stat-playing').textContent = games.filter(g => g.status === 'Playing').length;
            document.getElementById('stat-completed').textContent = games.filter(g => g.status === 'Completed').length;
            document.getElementById('stat-backlog').textContent = games.filter(g => g.status === 'Backlog').length;
        }

        // Setup all robust event listeners
        function setupEventListeners() {
            // Open modal buttons
            const openModalBtn = document.getElementById('open-modal-btn');
            if (openModalBtn) {
                openModalBtn.addEventListener('click', () => openModal());
            }

            const emptyAddBtn = document.getElementById('empty-add-btn');
            if (emptyAddBtn) {
                emptyAddBtn.addEventListener('click', () => openModal());
            }

            // Close modal buttons
            const closeModalBtn = document.getElementById('close-modal-btn');
            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', closeModal);
            }

            const cancelModalBtn = document.getElementById('cancel-modal-btn');
            if (cancelModalBtn) {
                cancelModalBtn.addEventListener('click', closeModal);
            }

            // Modal backdrop click to close
            const modal = document.getElementById('game-modal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
            }

            // Form submission listener
            const form = document.getElementById('game-form');
            if (form) {
                form.addEventListener('submit', handleFormSubmit);
            }

            // Search input listener
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', () => renderGames());
            }

            // Status filter buttons
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const status = e.currentTarget.getAttribute('data-filter');
                    setStatusFilter(status);
                });
            });
        }

        // Open Modal (Add or Edit)
        function openModal(gameId = null) {
            const modal = document.getElementById('game-modal');
            const modalTitle = document.getElementById('modal-title');
            const form = document.getElementById('game-form');
            
            form.reset();
            document.getElementById('game-id').value = '';

            if (gameId) {
                modalTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-neon-purple"></i><span>Edit Game Quest</span>`;
                const game = games.find(g => g.id === gameId);
                if (game) {
                    document.getElementById('game-id').value = game.id;
                    document.getElementById('form-title').value = game.title;
                    document.getElementById('form-platform').value = game.platform || '';
                    document.getElementById('form-level').value = game.level || '';
                    document.getElementById('form-status').value = game.status;
                    document.getElementById('form-notes').value = game.notes || '';
                }
            } else {
                modalTitle.innerHTML = `<i class="fa-solid fa-gamepad text-neon-purple"></i><span>Add New Game</span>`;
            }

            modal.classList.remove('hidden');
        }

        // Close Modal
        function closeModal() {
            const modal = document.getElementById('game-modal');
            if (modal) {
                modal.classList.add('hidden');
            }
        }

        // Handle Form Submit
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('game-id').value;
            const title = document.getElementById('form-title').value.trim();
            const platform = document.getElementById('form-platform').value.trim();
            const level = document.getElementById('form-level').value.trim();
            const status = document.getElementById('form-status').value;
            const notes = document.getElementById('form-notes').value.trim();

            if (!title) return;

            if (id) {
                // Update
                const index = games.findIndex(g => g.id === id);
                if (index !== -1) {
                    games[index] = { id, title, platform, level, status, notes };
                    showToast('Game updated successfully');
                }
            } else {
                // Create
                const newGame = {
                    id: Date.now().toString(),
                    title,
                    platform,
                    level,
                    status,
                    notes
                };
                games.unshift(newGame);
                showToast('Game added to tracker');
            }

            saveToLocalStorage();
            closeModal();
            renderGames();
        }

        // Set status filter and style active button
        function setStatusFilter(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-slate-400 hover:text-white border border-dark-700 transition-all whitespace-nowrap cursor-pointer';
            });
            const activeBtn = document.querySelector(`[data-filter="${status}"]`);
            if (activeBtn) {
                activeBtn.className = 'filter-btn px-4 py-2 rounded-xl text-xs font-semibold bg-neon-purple text-white shadow-sm transition-all whitespace-nowrap cursor-pointer';
            }
            renderGames();
        }

        // Render games table
        function renderGames() {
            const tbody = document.getElementById('games-table-body');
            const emptyState = document.getElementById('empty-state');
            const searchInput = document.getElementById('search-input');
            const searchQuery = searchInput ? searchInput.value.toLowerCase() : '';

            tbody.innerHTML = '';

            const filtered = games.filter(game => {
                const matchesFilter = currentFilter === 'All' || game.status === currentFilter;
                const matchesSearch = game.title.toLowerCase().includes(searchQuery) || 
                                      (game.platform && game.platform.toLowerCase().includes(searchQuery)) ||
                                      (game.level && game.level.toLowerCase().includes(searchQuery));
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(game => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-dark-700/30 transition-colors group';
                    
                    let badgeClass = 'bg-slate-700/50 text-slate-300 border-slate-600';
                    let dotColor = 'bg-slate-400';
                    if (game.status === 'Playing') {
                        badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                        dotColor = 'bg-emerald-400';
                    } else if (game.status === 'Completed') {
                        badgeClass = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                        dotColor = 'bg-purple-400';
                    } else if (game.status === 'Backlog') {
                        badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                        dotColor = 'bg-amber-400';
                    } else if (game.status === 'On Hold') {
                        badgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                        dotColor = 'bg-rose-400';
                    }

                    tr.innerHTML = `
                        <td class="py-4 px-6 font-semibold text-slate-100">
                            ${escapeHTML(game.title)}
                        </td>
                        <td class="py-4 px-6 text-slate-400 text-xs font-medium">
                            ${escapeHTML(game.platform || '—')}
                        </td>
                        <td class="py-4 px-6">
                            <div class="flex items-center space-x-2">
                                <span class="bg-dark-900 border border-dark-700 px-2.5 py-1 rounded-lg text-xs font-mono text-cyan-300 inline-block max-w-[200px] truncate" title="${escapeHTML(game.level || '—')}">
                                    ${escapeHTML(game.level || 'Not set')}
                                </span>
                                <button type="button" onclick="quickEditLevel('${game.id}')" class="text-slate-500 hover:text-neon-cyan transition-colors p-1 cursor-pointer" title="Quick Edit Level">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                            </div>
                        </td>
                        <td class="py-4 px-6">
                            <span class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-medium border ${badgeClass}">
                                <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span>
                                <span>${escapeHTML(game.status)}</span>
                            </span>
                        </td>
                        <td class="py-4 px-6 text-slate-400 text-xs max-w-xs truncate" title="${escapeHTML(game.notes || '')}">
                            ${escapeHTML(game.notes || '—')}
                        </td>
                        <td class="py-4 px-6 text-right space-x-2">
                            <button type="button" onclick="openModal('${game.id}')" class="p-2 bg-dark-700/50 hover:bg-dark-700 text-slate-300 hover:text-white rounded-xl transition-colors cursor-pointer" title="Edit Game">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button type="button" onclick="deleteGame('${game.id}')" class="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl transition-colors cursor-pointer" title="Delete Game">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            updateStats();
        }

        // Quick Edit Level helper
        function quickEditLevel(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            
            const newLevel = prompt(`Update current level/stage for "${game.title}":`, game.level || '');
            if (newLevel !== null) {
                game.level = newLevel.trim();
                saveToLocalStorage();
                renderGames();
                showToast('Level updated successfully');
            }
        }

        // Delete game helper
        function deleteGame(id) {
            if (confirm('Are you sure you want to remove this game quest?')) {
                games = games.filter(g => g.id !== id);
                saveToLocalStorage();
                renderGames();
                showToast('Game removed from tracker');
            }
        }

        // Toast Notification helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            if (!toast || !msgEl) return;

            msgEl.textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        // XSS Sanitizer
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
