<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETS 2 Map & Town Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ets: {
                            orange: '#ff9900',
                            gold: '#ffb700',
                            dark: '#0e141d',
                            panel: '#161f2c',
                            border: '#263445',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        #map-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 350px;
            background-color: #0e141d;
        }
        
        #map {
            width: 100%;
            height: 100%;
            min-height: 100%;
            z-index: 1;
        }

        /* Marker CSS Styles */
        .city-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.15s ease-out;
        }
        .city-marker:hover {
            transform: scale(1.35);
            z-index: 9999 !important;
        }
        .city-marker-inner {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .city-marker-visited .city-marker-inner {
            background-color: #10b981; /* Emerald Green */
            border-color: #ecfdf5;
            box-shadow: 0 0 10px #10b981;
        }
        .city-marker-unvisited .city-marker-inner {
            background-color: #ff9900; /* ETS Orange */
            border-color: #ffffff;
            box-shadow: 0 0 8px #ff9900;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #243042;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #364861;
        }

        /* Leaflet Dark Popup Customization */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #161f2c !important;
            color: #f8fafc !important;
            border: 1px solid #263445;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
            border-radius: 12px !important;
        }
        .leaflet-popup-content {
            margin: 12px 14px !important;
            line-height: 1.4 !important;
        }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row overflow-hidden bg-slate-950 text-slate-100">

    <!-- Sidebar Panel -->
    <aside id="sidebar" class="w-full md:w-[440px] bg-slate-900 border-r border-slate-800 flex flex-col h-1/2 md:h-full z-20 shadow-2xl shrink-0">

        <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">

                    <i class="fa-solid fa-truck-front"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                        ETS 2 <span class="text-[10px] bg-ets-orange/20 text-ets-orange px-2 py-0.5 rounded border border-ets-orange/30 font-bold uppercase">CHECKLIST</span>
                    </h1>
                    <p class="text-xs text-slate-400">Full Map & Town Visited Tracker</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1">
                <button id="export-btn" title="Export Progress (JSON)" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button id="import-btn-trigger" title="Import Progress (JSON)" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <input type="file" id="import-file-input" class="hidden" accept=".json">
                
                <button id="reset-all-btn" title="Reset All Progress" class="text-slate-400 hover:text-red-400 p-2 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- Overall Progress Card -->
        <div class="p-4 bg-slate-900 border-b border-slate-800 space-y-3">
            <div class="flex justify-between items-end">
                <div>
                    <span class="text-[10px] uppercase tracking-wider font-bold text-slate-400">Europe Completion</span>
                    <div class="text-2xl font-black text-white flex items-baseline gap-2">
                        <span id="visited-count">0</span>
                        <span class="text-sm font-normal text-slate-400">/ <span id="total-count">0</span> Cities</span>
                    </div>
                </div>
                <span id="overall-percentage" class="text-2xl font-black text-ets-orange">0%</span>
            </div>
            
            <div class="w-full bg-slate-950 rounded-full h-3 overflow-hidden p-0.5 border border-slate-800">
                <div id="overall-progress-bar" class="bg-gradient-to-r from-ets-orange via-amber-400 to-emerald-400 h-full rounded-full transition-all duration-500 w-0"></div>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="p-3 bg-slate-950 border-b border-slate-800 space-y-2">
            <!-- Search -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="search-input" placeholder="Search town or country..." 
                    class="w-full pl-9 pr-8 py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-ets-orange transition">
                <button id="clear-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Filters -->
            <div class="grid grid-cols-2 gap-2 text-xs">
                <select id="country-filter" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none focus:border-ets-orange">
                    <option value="ALL">All Countries</option>
                    <!-- Populated dynamically -->
                </select>

                <select id="status-filter" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none focus:border-ets-orange">
                    <option value="ALL">All Status</option>
                    <option value="VISITED">Visited Only</option>
                    <option value="UNVISITED">Unvisited Only</option>
                </select>
            </div>
        </div>

        <!-- Cities Accordion Checklist -->
        <div id="city-list-container" class="flex-1 overflow-y-auto divide-y divide-slate-800/60 bg-slate-900">
            <!-- Dynamic Content -->
        </div>

        <!-- Footer -->
        <div class="p-2.5 bg-slate-950 border-t border-slate-800 text-center text-[11px] text-slate-500 flex justify-between items-center px-4">
            <span id="country-count-badge">0 Countries Loaded</span>
            <span class="flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span> Saved Locally
            </span>
        </div>
    </aside>

    <!-- Map Viewport -->
    <main class="flex-1 relative h-1/2 md:h-full bg-slate-950">
        <div id="map-wrapper">
            <div id="map"></div>
        </div>

        <!-- Map Legend -->
        <div class="absolute top-4 right-4 z-20 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3 shadow-2xl text-xs space-y-2 hidden sm:block">
            <div class="font-bold text-slate-300 border-b border-slate-800 pb-1.5 flex justify-between items-center gap-4">
                <span>Map Legend</span>
                <i class="fa-solid fa-layer-group text-slate-500"></i>
            </div>
            <div class="flex items-center gap-2.5">
                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 border border-emerald-200 inline-block shadow-sm shadow-emerald-500/50"></span>
                <span class="text-slate-300 font-medium">Visited Town</span>
            </div>
            <div class="flex items-center gap-2.5">
                <span class="w-3.5 h-3.5 rounded-full bg-ets-orange border border-white inline-block shadow-sm shadow-orange-500/50"></span>
                <span class="text-slate-300 font-medium">Unvisited Town</span>
            </div>
        </div>

            <button id="recenter-map-btn" title="Recenter Map over Europe"

                <i class="fa-solid fa-crosshairs text-base"></i>
            </button>
        </div>
    </main>

        // Deduplicate and ID generation
        const ETS2_CITIES = [];
        const seenKeys = new Set();

        ETS2_FULL_DATASET.forEach(city => {
            const id = `${city.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${city.country.toLowerCase().replace(/[^a-z0-9]/g, '_')}`;
            if (!seenKeys.has(id)) {
                seenKeys.add(id);
                ETS2_CITIES.push({ ...city, id });
            }
        });

        // App state
        let visitedCities = new Set();
        let map = null;
        let markersMap = new Map();
        const STORAGE_KEY = "ets2_town_checklist_v3";

        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    visitedCities = new Set(JSON.parse(saved));
                }
            } catch (e) {
                console.error("Failed to load saved progress:", e);
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify([...visitedCities]));
            } catch (e) {
                console.error("Failed to save progress:", e);
            }
        }

        function toggleCityVisited(cityId) {
            if (visitedCities.has(cityId)) {
                visitedCities.delete(cityId);
            } else {
                visitedCities.add(cityId);
            }
            saveProgress();
            updateMarkerStyle(cityId);
            updateStatsAndList();
        }

        function setCountryVisited(countryName, setVisited) {
            ETS2_CITIES.forEach(city => {
                if (city.country === countryName) {
                    if (setVisited) visitedCities.add(city.id);
                    else visitedCities.delete(city.id);
                    updateMarkerStyle(city.id);
                }
            });
            saveProgress();
            updateStatsAndList();
        }

        // Map Setup
        function initMap() {
            const mapContainer = document.getElementById('map');
            if (!mapContainer) return;

            map = L.map('map', {
                center: [54.0, 15.0],
                zoom: 4,
                zoomControl: false,
                attributionControl: false
            });

            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            // Esri Dark Gray Canvas (Primary)
            const esriDarkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16,
                minZoom: 3,
                attribution: 'Tiles &copy; Esri'
            });

            // OpenStreetMap Fallback
            const osmFallbackLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                minZoom: 3,
                attribution: '&copy; OpenStreetMap contributors'
            });

            let hasFallenBack = false;
            esriDarkLayer.on('tileerror', function() {
                if (!hasFallenBack) {
                    hasFallenBack = true;
                    map.removeLayer(esriDarkLayer);
                    osmFallbackLayer.addTo(map);
                }
            });

            esriDarkLayer.addTo(map);

            L.control.layers({
                "Dark Canvas (Esri)": esriDarkLayer,
                "OpenStreetMap": osmFallbackLayer
            }, null, { position: 'bottomright' }).addTo(map);

            // Populate Map Markers
            ETS2_CITIES.forEach(city => {
                const isVisited = visitedCities.has(city.id);

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div id="marker-${city.id}" class="city-marker ${isVisited ? 'city-marker-visited' : 'city-marker-unvisited'}">
                            <div class="city-marker-inner"></div>
                           </div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                const marker = L.marker([city.lat, city.lng], { icon: customIcon }).addTo(map);

                marker.bindPopup(() => createPopupContent(city.id));
                markersMap.set(city.id, marker);
            });

            setTimeout(() => {
                map.invalidateSize();
            }, 250);
        }

        function createPopupContent(cityId) {
            const city = ETS2_CITIES.find(c => c.id === cityId);
            if (!city) return '';
            const isVisited = visitedCities.has(cityId);

            return `
                <div class="text-center font-sans p-1">
                    <div class="font-bold text-base text-slate-100">${city.name}</div>
                    <div class="text-xs text-slate-400 mb-3"><span class="text-ets-orange font-semibold">${city.country}</span></div>
                    <button onclick="toggleCityVisited('${city.id}')" 
                        class="px-4 py-2 rounded-lg text-xs font-bold text-white transition flex items-center justify-center gap-2 w-full ${isVisited ? 'bg-emerald-600 hover:bg-emerald-500 shadow-lg shadow-emerald-600/30' : 'bg-ets-orange hover:bg-orange-500 shadow-lg shadow-orange-500/30'}">
                        <i class="fa-solid ${isVisited ? 'fa-circle-check' : 'fa-circle'}"></i>
                        <span>${isVisited ? 'Visited Town' : 'Mark as Visited'}</span>
                    </button>
                </div>
            `;
        }

        function updateMarkerStyle(cityId) {
            const isVisited = visitedCities.has(cityId);
            const markerEl = document.getElementById(`marker-${cityId}`);
            if (markerEl) {
                markerEl.className = `city-marker ${isVisited ? 'city-marker-visited' : 'city-marker-unvisited'}`;
            }

            const marker = markersMap.get(cityId);
            if (marker && marker.getPopup() && marker.getPopup().isOpen()) {
                marker.getPopup().setContent(createPopupContent(cityId));
            }
        }

        function populateCountryFilterOptions() {
            const countryFilter = document.getElementById('country-filter');
            const countries = [...new Set(ETS2_CITIES.map(c => c.country))].sort();

            document.getElementById('country-count-badge').textContent = `${countries.length} Countries Loaded`;

            countries.forEach(country => {
                const opt = document.createElement('option');
                opt.value = country;
                opt.textContent = country;
                countryFilter.appendChild(opt);
            });
        }

        function updateStatsAndList() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const countryFilter = document.getElementById('country-filter').value;
            const statusFilter = document.getElementById('status-filter').value;

            const totalCount = ETS2_CITIES.length;
            const visitedCount = visitedCities.size;
            const overallPct = Math.round((visitedCount / totalCount) * 100);

            document.getElementById('visited-count').textContent = visitedCount;
            document.getElementById('total-count').textContent = totalCount;
            document.getElementById('overall-percentage').textContent = `${overallPct}%`;
            document.getElementById('overall-progress-bar').style.width = `${overallPct}%`;

            const countryGroups = {};

            ETS2_CITIES.forEach(city => {
                const matchesSearch = city.name.toLowerCase().includes(searchTerm) || city.country.toLowerCase().includes(searchTerm);
                const matchesCountry = countryFilter === 'ALL' || city.country === countryFilter;
                const isVisited = visitedCities.has(city.id);
                const matchesStatus = statusFilter === 'ALL' || 
                                     (statusFilter === 'VISITED' && isVisited) || 
                                     (statusFilter === 'UNVISITED' && !isVisited);

                if (matchesSearch && matchesCountry && matchesStatus) {
                    if (!countryGroups[city.country]) countryGroups[city.country] = [];
                    countryGroups[city.country].push(city);
                }
            });

            const container = document.getElementById('city-list-container');
            container.innerHTML = '';

            const sortedCountries = Object.keys(countryGroups).sort();

            if (sortedCountries.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-500">
                        <i class="fa-solid fa-map-location-dot text-3xl mb-3 opacity-40"></i>
                        <p class="text-xs">No towns matched your search or filters.</p>
                    </div>
                `;
                return;
            }

            sortedCountries.forEach(countryName => {
                const citiesInGroup = countryGroups[countryName];
                const allCountryCities = ETS2_CITIES.filter(c => c.country === countryName);
                const visitedInCountry = allCountryCities.filter(c => visitedCities.has(c.id)).length;
                const groupPct = Math.round((visitedInCountry / allCountryCities.length) * 100);

                const groupEl = document.createElement('div');
                groupEl.className = "bg-slate-900 border-b border-slate-800/80";

                groupEl.innerHTML = `
                    <div class="p-3 bg-slate-950/80 flex items-center justify-between sticky top-0 z-10 border-b border-slate-800 backdrop-blur">
                        <div class="flex-1 pr-3">
                            <div class="flex items-center justify-between mb-1">
                                <span class="font-bold text-xs text-slate-200 uppercase tracking-wider">${countryName}</span>
                                <span class="text-[11px] text-slate-400">${visitedInCountry} / ${allCountryCities.length} (${groupPct}%)</span>
                            </div>
                            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: ${groupPct}%"></div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="setCountryVisited('${countryName.replace(/'/g, "\\'")}', true)" title="Mark all in ${countryName}" class="px-2 py-1 text-xs bg-slate-800 hover:bg-emerald-950 hover:text-emerald-400 text-slate-300 rounded border border-slate-700 transition">
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <button onclick="setCountryVisited('${countryName.replace(/'/g, "\\'")}', false)" title="Uncheck all in ${countryName}" class="px-2 py-1 text-xs bg-slate-800 hover:bg-red-950 hover:text-red-400 text-slate-300 rounded border border-slate-700 transition">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                    <div class="divide-y divide-slate-800/40">
                        ${citiesInGroup.map(city => {
                            const isVisited = visitedCities.has(city.id);
                            return `
                                <div class="px-3.5 py-2.5 flex items-center justify-between hover:bg-slate-800/60 transition cursor-pointer group" onclick="focusCityOnMap('${city.id}')">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" ${isVisited ? 'checked' : ''} 
                                            onclick="event.stopPropagation(); toggleCityVisited('${city.id}')"
                                            class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-emerald-500 focus:ring-emerald-500/20 focus:ring-offset-slate-900 cursor-pointer">
                                        <div>
                                            <div class="text-xs font-semibold ${isVisited ? 'text-emerald-400 line-through opacity-75' : 'text-slate-200 group-hover:text-white'}">
                                                ${city.name}
                                            </div>
                                        </div>
                                    </div>
                                    <button class="text-slate-600 group-hover:text-ets-orange text-xs p-1">
                                        <i class="fa-solid fa-location-crosshairs"></i>
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                container.appendChild(groupEl);
            });
        }

        function focusCityOnMap(cityId) {
            const city = ETS2_CITIES.find(c => c.id === cityId);
            const marker = markersMap.get(cityId);
            if (city && marker) {
                map.flyTo([city.lat, city.lng], 8, { duration: 1 });
                marker.openPopup();
            }
        }

        function exportProgress() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify([...visitedCities]));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `ets2_visited_towns_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        visitedCities = new Set(importedData);
                        saveProgress();
                        ETS2_CITIES.forEach(c => updateMarkerStyle(c.id));
                        updateStatsAndList();
                        alert('Town completion data imported successfully!');
                    }
                } catch (err) {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            populateCountryFilterOptions();
            initMap();
            updateStatsAndList();

            window.addEventListener('resize', () => {
                if (map) map.invalidateSize();
            });

            const searchInput = document.getElementById('search-input');
            const clearSearchBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', () => {
                clearSearchBtn.classList.toggle('hidden', searchInput.value.length === 0);
                updateStatsAndList();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                updateStatsAndList();
            });

            document.getElementById('country-filter').addEventListener('change', updateStatsAndList);
            document.getElementById('status-filter').addEventListener('change', updateStatsAndList);

            document.getElementById('recenter-map-btn').addEventListener('click', () => {
                map.flyTo([54.0, 15.0], 4, { duration: 1 });
            });

            document.getElementById('reset-all-btn').addEventListener('click', () => {
                if (confirm('Clear all visited towns and start fresh?')) {
                    visitedCities.clear();
                    saveProgress();
                    ETS2_CITIES.forEach(c => updateMarkerStyle(c.id));
                    updateStatsAndList();
                }
            });

            document.getElementById('export-btn').addEventListener('click', exportProgress);
            document.getElementById('import-btn-trigger').addEventListener('click', () => {
                document.getElementById('import-file-input').click();
            });
            document.getElementById('import-file-input').addEventListener('change', importProgress);
        });
    </script>
</body>
</html>
