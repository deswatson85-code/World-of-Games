<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chalkboard Table Web App</title>

  <!-- Google Fonts: Permanent Marker & Caveat for authentic chalk handwriting -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Permanent+Marker&display=swap" rel="stylesheet">

  <style>
    /* Reset & Page Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1512;
      background-image: radial-gradient(#2c221a 1px, transparent 0);
      background-size: 24px 24px;
      font-family: 'Caveat', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      color: #f0f0f0;
    }

    /* Outer Wooden Frame */
    .chalkboard-frame {
      background: #5c3a21;
      background-image: 
        linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 50%, rgba(255,255,255,0.05) 100%),
        repeating-linear-gradient(0deg, #4a2e19, #4a2e19 10px, #5c3a21 10px, #5c3a21 20px);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.8),
        inset 0 2px 5px rgba(255,255,255,0.2),
        inset 0 -3px 8px rgba(0,0,0,0.6);
      max-width: 1000px;
      width: 100%;
      position: relative;
    }

    /* Inner Chalkboard Surface */
    .chalkboard {
      background: #1e2822; /* Dark slate green */
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 80%),
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 4px);
      border: 3px solid #111814;
      border-radius: 4px;
      padding: 30px;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Control Bar inside the Frame */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
      align-items: center;
      justify-content: space-between;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: #f0f0f0;
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      padding: 6px 16px;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; /* Slight hand-drawn organic curve */
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 0 3px rgba(255,255,255,0.5);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffffff;
      transform: scale(1.03) rotate(-1deg);
    }

    .btn-clear {
      border-color: rgba(255, 120, 120, 0.7);
      color: #ffb3b3;
    }

    .btn-clear:hover {
      background: rgba(255, 80, 80, 0.2);
    }

    /* Chalkboard Title */
    .chalk-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.2rem;
      color: #ffffff;
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-shadow: 
        0 0 2px #fff,
        2px 2px 8px rgba(255, 255, 255, 0.4);
      border: none;
      background: transparent;
      width: 100%;
      outline: none;
    }

    .chalk-title:focus {
      border-bottom: 2px dashed rgba(255, 255, 255, 0.4);
    }

    /* Table Styling */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #f5f5f5;
      font-size: 1.5rem;
    }

    th, td {
      border: 2px solid rgba(255, 255, 255, 0.45);
      padding: 12px 16px;
      text-align: left;
      position: relative;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.6);
    }

    th {
      font-family: 'Permanent Marker', cursive;
      font-weight: normal;
      font-size: 1.4rem;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 3px double rgba(255, 255, 255, 0.7);
      color: #fffde7; /* Slightly warm off-white chalk */
    }

    td input, th input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      text-shadow: inherit;
    }

    td input:focus, th input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Action buttons per row/col */
    .delete-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 120, 120, 0.6);
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    tr:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      color: #ff5555;
    }

    /* Chalk Dust/Eraser Bottom Tray */
    .chalk-tray {
      position: absolute;
      bottom: -15px;
      left: 10%;
      right: 10%;
      height: 14px;
      background: #3e2615;
      border-radius: 3px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.5);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .eraser {
      width: 70px;
      height: 18px;
      background: #2b1a0e;
      border-top: 5px solid #8c7b6c; /* Felt top */
      border-radius: 2px;
      transform: translateY(-4px);
      box-shadow: 1px 2px 4px rgba(0,0,0,0.4);
    }

    .chalk-stick {
      width: 35px;
      height: 8px;
      background: #f0f0f0;
      border-radius: 2px;
      transform: translateY(-2px) rotate(3deg);
      box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    .chalk-stick.yellow { background: #fff59d; }
    .chalk-stick.pink { background: #f48fb1; }
  </style>
</head>
<body>

  <div class="chalkboard-frame">
    <div class="chalkboard">
      
      <!-- Controls -->
      <div class="controls">
        <div class="btn-group">
          <button class="btn" onclick="addRow()">+ Add Row</button>
          <button class="btn" onclick="addColumn()">+ Add Column</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-clear" onclick="clearData()">Clear Board</button>
        </div>
      </div>

      <!-- Editable Title -->
      <input type="text" class="chalk-title" value="Classroom Menu & Schedule" />

      <!-- Table -->
      <div class="table-container">
        <table id="chalkTable">
          <thead>
            <tr id="headerRow">
              <th><input type="text" value="Day" /></th>
              <th><input type="text" value="Subject" /></th>
              <th><input type="text" value="Teacher" /></th>
              <th><input type="text" value="Status" /></th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td><input type="text" value="Monday" /></td>
              <td><input type="text" value="Mathematics" /></td>
              <td><input type="text" value="Mr. Euler" /></td>
              <td><input type="text" value="Complete" /></td>
            </tr>
            <tr>
              <td><input type="text" value="Tuesday" /></td>
              <td><input type="text" value="Physics" /></td>
              <td><input type="text" value="Dr. Newton" /></td>
              <td><input type="text" value="In Progress" /></td>
            </tr>
            <tr>
              <td><input type="text" value="Wednesday" /></td>
              <td><input type="text" value="Literature" /></td>
              <td><input type="text" value="Ms. Austen" /></td>
              <td><input type="text" value="Pending" /></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <!-- Chalk Tray with Eraser Details -->
    <div class="chalk-tray">
      <div class="eraser"></div>
      <div class="chalk-stick"></div>
      <div class="chalk-stick yellow"></div>
      <div class="chalk-stick pink"></div>
    </div>
  </div>

  <script>
    // Add a new row to the table
    function addRow() {
      const tbody = document.getElementById('tableBody');
      const colCount = document.getElementById('headerRow').children.length;
      
      const newRow = document.createElement('tr');
      for (let i = 0; i < colCount; i++) {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '...';
        td.appendChild(input);
        newRow.appendChild(td);
      }
      tbody.appendChild(newRow);
    }

    // Add a new column to the table
    function addColumn() {
      const headerRow = document.getElementById('headerRow');
      const colIndex = headerRow.children.length + 1;
      
      // Header item
      const th = document.createElement('th');
      const headerInput = document.createElement('input');
      headerInput.type = 'text';
      headerInput.value = 'Header ' + colIndex;
      th.appendChild(headerInput);
      headerRow.appendChild(th);

      // Body cells
      const rows = document.getElementById('tableBody').querySelectorAll('tr');
      rows.forEach(row => {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '...';
        td.appendChild(input);
        row.appendChild(td);
      });
    }

    // Clear content inside inputs
    function clearData() {
      if (confirm('Are you sure you want to clear all contents?')) {
        const inputs = document.querySelectorAll('table input');
        inputs.forEach(input => input.value = '');
      }
    }
  </script>

</body>
</html>
